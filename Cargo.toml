[package]
name = "wake"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Wake-on-LAN and one-shot GRUB boot selection for a dual-boot PC"
publish = false

[[bin]]
name = "wake"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dependencies]
anyhow = "1.0.104"
askama = "0.16.1"
axum = "0.8.9"
futures-util = "0.3.34"
humantime = "2.4.0"
rust-embed = { version = "8.12.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
surge-ping = "0.9.1"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
